<main class="change-password-page">
  <section class="panel" aria-labelledby="change-password-heading">
    <div class="header">
      <span class="eyebrow">{{ dictionary.account.accessSecurity }}</span>
      <h1 id="change-password-heading">{{ dictionary.account.changePassword }}</h1>
      <p>{{ dictionary.account.changePasswordDescription }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="currentPassword">{{ dictionary.account.currentPassword }}</label>
      <div class="field">
        <input
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.currentPassword.invalid && form.controls.currentPassword.touched ? 'true' : null"
          [placeholder]="dictionary.account.yourCurrentPassword"
        />
      </div>

      <label for="newPassword">{{ dictionary.account.newPassword }}</label>
      <div class="field">
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched ? 'true' : null"
          [placeholder]="dictionary.account.minimumPassword"
        />
      </div>

      <label for="confirmation">{{ dictionary.account.confirmation }}</label>
      <div class="field">
        <input
          id="confirmation"
          type="password"
          formControlName="confirmation"
          autocomplete="new-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.confirmation.touched && (form.controls.confirmation.invalid || form.controls.confirmation.value !== form.controls.newPassword.value) ? 'true' : null"
          [placeholder]="dictionary.account.repeatPassword"
        />
      </div>

      <p id="change-password-help" class="help">
        {{ dictionary.account.passwordHelp }}
      </p>

      @if (error()) {
        <p id="change-password-error" class="error" role="alert">{{ error() }}</p>
      }

      <div class="actions">
        <button class="primary" type="submit" [disabled]="loading()">
          {{ loading() ? dictionary.account.updating : dictionary.account.savePassword }}
        </button>
        <button class="secondary" type="button" (click)="router.navigate(['/login'])">
          {{ dictionary.account.cancel }}
        </button>
      </div>
    </form>
  </section>
</main>
