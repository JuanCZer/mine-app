name: Despliegue provisional

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mineapp-provisional
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, mineapp-provisional]
    env:
      COMPOSE_PROJECT_NAME: mineapp-dev
    steps:
      - name: Obtener el commit de main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Construir imagen
        env:
          MINE_APP_IMAGE_TAG: ${{ github.sha }}
        run: docker compose --env-file /opt/mine-app-provisional/deploy.env -f deploy/provisional/compose.yaml build --pull
      - name: Actualizar contenedor
        env:
          MINE_APP_IMAGE_TAG: ${{ github.sha }}
        run: docker compose --env-file /opt/mine-app-provisional/deploy.env -f deploy/provisional/compose.yaml up -d --no-build --wait --wait-timeout 60
