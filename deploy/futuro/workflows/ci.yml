name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Commit exacto validado para comprobar
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valor de prueba público y sintético: no permite usar Mapbox en producción.
      MAPBOX_PUBLIC_TOKEN: pk.synthetic.test
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Configurar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Instalar dependencias
        run: npm ci
      - name: Probar configuración
        run: npm run test:env
      - name: Probar Angular
        run: npm test -- --watch=false
      - name: Compilar Angular
        run: npm run build:clean
      - name: Compilar solución .NET
        run: dotnet build server/MineApp.sln --nologo
      - name: Probar servidor
        run: npm run test:server
      - name: Construir imagen web
        run: docker build --file Dockerfile --build-arg MAPBOX_PUBLIC_TOKEN=pk.synthetic.test --tag mineapp-web:ci .
