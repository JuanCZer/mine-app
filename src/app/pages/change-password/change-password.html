<main class="change-password-page">
  <section class="panel" aria-labelledby="change-password-heading">
    <div class="header">
      <span class="eyebrow">SEGURIDAD DE ACCESO</span>
      <h1 id="change-password-heading">Cambiar contraseña</h1>
      <p>Actualiza tu contraseña para continuar con la sesión de forma segura.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="currentPassword">Contraseña actual</label>
      <div class="field">
        <input
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.currentPassword.invalid && form.controls.currentPassword.touched ? 'true' : null"
          placeholder="Tu contraseña actual"
        />
      </div>

      <label for="newPassword">Nueva contraseña</label>
      <div class="field">
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched ? 'true' : null"
          placeholder="Mínimo 15 caracteres"
        />
      </div>

      <label for="confirmation">Confirmación</label>
      <div class="field">
        <input
          id="confirmation"
          type="password"
          formControlName="confirmation"
          autocomplete="new-password"
          [attr.aria-describedby]="error() ? 'change-password-help change-password-error' : 'change-password-help'"
          [attr.aria-invalid]="form.controls.confirmation.touched && (form.controls.confirmation.invalid || form.controls.confirmation.value !== form.controls.newPassword.value) ? 'true' : null"
          placeholder="Repite la nueva contraseña"
        />
      </div>

      <p id="change-password-help" class="help">
        Usa una contraseña de 15 a 128 caracteres. La nueva contraseña debe ser distinta a la actual.
      </p>

      @if (error()) {
        <p id="change-password-error" class="error" role="alert">{{ error() }}</p>
      }

      <div class="actions">
        <button class="primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Actualizando…' : 'Guardar contraseña' }}
        </button>
        <button class="secondary" type="button" (click)="router.navigate(['/login'])">
          Cancelar
        </button>
      </div>
    </form>
  </section>
</main>
